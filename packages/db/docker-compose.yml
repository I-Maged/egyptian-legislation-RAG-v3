# docker-compose.yml
services:
  postgres:
    image: ankane/pgvector   # Postgres 16 + pgvector preinstalled
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: egyptian_law_rag_v3
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: